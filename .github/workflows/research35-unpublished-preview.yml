name: First Light 3.5 Research Desk Preview (No Voice)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/research35-unpublished-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: first-light-research35-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-preview:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'START FIRST LIGHT RESEARCH 3.5 ONE SHOT') }}
    name: Verify live source coverage and unpublished research transcript
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out current tested source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install only research dependencies
        run: python -m pip install -r requirements.txt

      - name: Run full offline regression suite before external source calls
        run: python -m unittest discover -s tests -v

      - name: Generate source-only unpublished research review (no TTS)
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          FEED_BASE_URL: ${{ vars.FEED_BASE_URL }}
        run: python -m src.first_light_research35_preview

      - name: Upload research QA only (no audio, RSS or Pages)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-light-research35-unpublished
          path: research-preview/
          if-no-files-found: warn
          retention-days: 1
