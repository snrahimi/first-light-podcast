name: First Light Narrator Voice Test

on:
  push:
    paths:
      - '.github/workflows/voice-test.yml'
      - 'src/voice_test.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  voice-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install HTTP client
        run: python -m pip install 'requests>=2.32,<3'

      - name: Generate chosen narrator sample
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: python src/voice_test.py

      - name: Upload sample audio
        uses: actions/upload-artifact@v4
        with:
          name: first-light-narrator-preview
          path: work/narrator-preview.mp3
          retention-days: 7
