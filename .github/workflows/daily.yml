name: First Light Daily Podcast

on:
  schedule:
    - cron: '30 3 * * *'
      timezone: America/Chicago
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: first-light-daily
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out source code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install narration and news dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng
          pip install -r requirements.txt

      - name: Run offline tests
        run: python -m unittest discover -s tests -v

      - name: Restore matching evidence-fingerprinted script sections
        uses: actions/cache/restore@v4
        with:
          path: .first-light-cache
          key: ${{ runner.os }}-first-light-script-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-first-light-script-

      - name: Generate and publish podcast (Brian primary, Daniel backup)
        env:
          FIRST_LIGHT_SCRIPT_CACHE_DIR: .first-light-cache
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          FIRST_LIGHT_NARRATOR: ${{ vars.FIRST_LIGHT_NARRATOR || 'elevenlabs' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FEED_BASE_URL: ${{ vars.FEED_BASE_URL }}
        run: python -m src.first_light

      - name: Check whether validated writer sections exist
        id: saved_sections
        if: always()
        shell: bash
        run: |
          if [ -d .first-light-cache ] && find .first-light-cache -type f -name 'section-*.json' -print -quit | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No validated script sections to preserve."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Preserve validated script sections for same-evidence retries
        if: always() && steps.saved_sections.outputs.present == 'true'
        uses: actions/cache/save@v4
        with:
          path: .first-light-cache
          key: ${{ runner.os }}-first-light-script-${{ github.run_id }}

      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Confirm uploaded Pages artifact is visible to the workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
                 --jq '[.artifacts[].name] | index("github-pages") != null' | grep -qx 'true'; then
              echo "github-pages artifact indexed and accessible (attempt ${attempt})."
              sleep 8
              exit 0
            fi
            echo "Waiting for github-pages artifact indexing: ${attempt}/18"
            sleep 5
          done
          echo "::error::github-pages artifact was uploaded but is not visible yet."
          exit 1

      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
